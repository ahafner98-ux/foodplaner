<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ff6b6b">
  <title>🍽️ Unser Foodplaner</title>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc, setDoc, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    // ╔══════════════════════════════════════════════════╗
    // ║  FIREBASE CONFIG — hier deine Daten eintragen!  ║
    // ║  Anleitung: siehe ANLEITUNG.md                  ║
    // ╚══════════════════════════════════════════════════╝
    const firebaseConfig = {
      apiKey: "AIzaSyD7jiBwcfyVxzdUxy8utLTc7PDpK9eUQ-E",
      authDomain: "unser-foodplaner.firebaseapp.com",
      projectId: "unser-foodplaner",
      storageBucket: "unser-foodplaner.firebasestorage.app",
      messagingSenderId: "323877181638",
      appId: "1:323877181638:web:2e6e5ef24b50d320bb9fc7"
    };

    let db;
    let firebaseReady = false;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      firebaseReady = !firebaseConfig.apiKey.includes("DEINE");
    } catch(e) { console.warn("Firebase nicht konfiguriert"); }

    // ─────────────────────────────────────────────────
    // AUTO-KATEGORIE: Keyword-Map
    // ─────────────────────────────────────────────────
    const KEYWORD_CATS = {
      '🥦 Gemüse & Obst': ['tomate','kartoffel','apfel','banane','zwiebel','knoblauch','salat','gurke','paprika','zucchini','möhre','karotte','spinat','champignon','pilz','brokkoli','blumenkohl','lauch','porree','orange','zitrone','beere','erdbeere','heidelbeere','himbeere','traube','birne','pfirsich','mango','avocado','aprikose','kiwi','melone','wassermelone','ananas','kohlrabi','fenchel','sellerie','aubergine','chili','ingwer','limette','kürbis','rucola','mais','erbsen','bohnen','blattsalat','feldsalat','radieschen','rettich','pak choi','frühlingszwiebel','schalotte','süßkartoffel','yam','limone','grapefruit','physalis'],
      '🥩 Fleisch & Fisch': ['hähnchen','hühnchen','huhn','rindfleisch','rind','schwein','schweinefleisch','hackfleisch','hack','steak','schnitzel','filet','wurst','bratwurst','schinken','speck','bacon','lachs','thunfisch','fisch','garnele','shrimp','meeresfrüchte','kalb','lamm','pute','ente','salami','chorizo','weißwurst','leberkäse','forelle','hering','kabeljau','dorade','wolfsbarsch','lachssteak','sashimi'],
      '🥛 Milch & Käse': ['milch','käse','joghurt','butter','sahne','quark','frischkäse','mozzarella','parmesan','cheddar','skyr','kefir','schmand','crème fraîche','gouda','emmentaler','brie','camembert','ricotta','ei','eier','schlagsahne','kondensmilch','buttermilch','obers','rahm','mascarpone','feta','halloumi','gruyère'],
      '🍞 Brot & Backwaren': ['brot','brötchen','toast','croissant','baguette','mehl','backpulver','hefe','nudeln','pasta','spaghetti','penne','fusilli','tagliatelle','reis','haferflocken','müsli','cornflakes','semmel','laugenbrezel','bagel','tortilla','wrap','ciabatta','focaccia','vollkornbrot','pumpernickel','knäckebrot','zwieback','dinkel','couscous','quinoa','bulgur'],
      '🥫 Konserven & Trocken': ['dose','konserve','linsen','kichererbsen','öl','olivenöl','rapsöl','essig','zucker','salz','tomatenmark','kokosmilch','brühe','suppenwürfel','chips','kekse','schokolade','marmelade','honig','nüsse','mandeln','walnüsse','erdnüsse','cashews','rosinen','getrocknete tomaten','sonnenblumenkerne','leinsamen','sesam','tahini','peanutbutter','erdnussbutter','nutella','ahornsirup'],
      '🧴 Drogerie': ['shampoo','duschgel','zahnpasta','zahnbürste','seife','deo','waschmittel','spülmittel','klopapier','toilettenpapier','taschentuch','creme','lotion','makeup','rasierklinge','rasiercreme','müllbeutel','schwamm','wattestäbchen','wattepads','nagellack','parfüm','bodylotion','sonnencreme','lippenstift','mascara','conditioner','haarspray'],
      '🌶️ Gewürze & Soßen': ['pfeffer','curry','oregano','basilikum','thymian','rosmarin','petersilie','koriander','zimt','kümmel','kurkuma','gewürz','soße','sauce','ketchup','senf','mayo','mayonnaise','worcester','tabasco','sambal','pesto','sojasauce','fischsoße','sriracha','harissa','chimichurri','teriyaki','hoisin','barbecuesoße','bbq','würzmischung','paprikapulver','cayennepfeffer','muskat','kardamom','nelke','sternanis','lorbeer','majoran','salbei','minze','dill','schnittlauch'],
      '🧃 Getränke': ['wasser','saft','cola','fanta','sprite','bier','wein','kaffee','tee','limo','limonade','sprudel','mineralwasser','energydrink','redbull','monster','orangensaft','apfelsaft','traubensaft','smoothie','eistee','kakao','hot chocolate','prosecco','sekt','champagner','whisky','rum','gin','vodka','likör','aperol'],
    };

    function guessCategory(name) {
      const lower = name.toLowerCase();
      for (const [cat, keywords] of Object.entries(KEYWORD_CATS)) {
        for (const kw of keywords) {
          if (lower.includes(kw)) return cat;
        }
      }
      return '❓ Sonstiges';
    }

    // ─────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────
    let currentTab = 'shopping';
    let shoppingItems = [];
    let recipes = [];
    let tiktoks = [];
    let mealPlan = {};
    const DAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];
    const DAYFULL = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
    const CAT_LIST = Object.keys(KEYWORD_CATS).concat(['❓ Sonstiges']);

    // ─────────────────────────────────────────────────
    // WEEK DATES
    // ─────────────────────────────────────────────────
    function getWeekDates() {
      const today = new Date();
      const dow = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
      return DAYS.map((_, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        return d;
      });
    }
    function fmtDate(d) {
      return `${d.getDate()}.${d.getMonth()+1}.`;
    }
    function isToday(d) {
      const t = new Date();
      return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
    }

    // ─────────────────────────────────────────────────
    // LOCAL STORAGE FALLBACK
    // ─────────────────────────────────────────────────
    function saveLocal(key, data) { localStorage.setItem('foodapp_'+key, JSON.stringify(data)); }
    function loadLocal(key, def=[]) { try { return JSON.parse(localStorage.getItem('foodapp_'+key))||def; } catch { return def; } }

    // ─────────────────────────────────────────────────
    // FIREBASE LISTENERS
    // ─────────────────────────────────────────────────
    function startListeners() {
      if (!firebaseReady) {
        shoppingItems = loadLocal('shopping', []);
        recipes = loadLocal('recipes', []);
        tiktoks = loadLocal('tiktoks', []);
        mealPlan = loadLocal('mealplan', {});
        renderCurrentTab();
        document.getElementById('offline-banner').style.display = 'flex';
        return;
      }
      onSnapshot(query(collection(db,'shopping'), orderBy('createdAt','asc')), snap => {
        shoppingItems = snap.docs.map(d => ({id:d.id,...d.data()}));
        if (currentTab==='shopping') renderShopping();
      });
      onSnapshot(query(collection(db,'recipes'), orderBy('createdAt','asc')), snap => {
        recipes = snap.docs.map(d => ({id:d.id,...d.data()}));
        if (currentTab==='recipes') renderRecipes();
        if (currentTab==='meals') renderMeals();
      });
      onSnapshot(query(collection(db,'tiktoks'), orderBy('createdAt','desc')), snap => {
        tiktoks = snap.docs.map(d => ({id:d.id,...d.data()}));
        if (currentTab==='tiktok') renderTikTok();
      });
      onSnapshot(doc(db,'config','mealplan'), snap => {
        mealPlan = snap.exists() ? snap.data() : {};
        if (currentTab==='meals') renderMeals();
      });
    }

    // ─────────────────────────────────────────────────
    // SHOPPING ACTIONS
    // ─────────────────────────────────────────────────
    async function addShoppingItem(name, cat) {
      const item = { name, cat, checked:false, createdAt: firebaseReady ? serverTimestamp() : Date.now() };
      if (firebaseReady) await addDoc(collection(db,'shopping'), item);
      else { item.id=Date.now()+''; shoppingItems.push(item); saveLocal('shopping',shoppingItems); renderShopping(); }
    }
    async function addShoppingItems(items) {
      // items = [{name, cat}]
      for (const it of items) {
        if (it.name.trim()) await addShoppingItem(it.name.trim(), it.cat || guessCategory(it.name.trim()));
      }
    }
    async function toggleShoppingItem(id) {
      const item = shoppingItems.find(i=>i.id===id);
      if (!item) return;
      if (firebaseReady) await updateDoc(doc(db,'shopping',id), {checked:!item.checked});
      else { item.checked=!item.checked; saveLocal('shopping',shoppingItems); renderShopping(); }
    }
    async function deleteShoppingItem(id) {
      if (firebaseReady) await deleteDoc(doc(db,'shopping',id));
      else { shoppingItems=shoppingItems.filter(i=>i.id!==id); saveLocal('shopping',shoppingItems); renderShopping(); }
    }
    async function clearCheckedItems() {
      const checked = shoppingItems.filter(i=>i.checked);
      for (const item of checked) await deleteShoppingItem(item.id);
    }

    // ─────────────────────────────────────────────────
    // RECIPE ACTIONS
    // ─────────────────────────────────────────────────
    async function addRecipe(name, ingredients, instructions) {
      const r = { name, ingredients, instructions, createdAt: firebaseReady ? serverTimestamp() : Date.now() };
      if (firebaseReady) await addDoc(collection(db,'recipes'), r);
      else { r.id=Date.now()+''; recipes.push(r); saveLocal('recipes',recipes); renderRecipes(); }
    }
    async function deleteRecipe(id) {
      if (firebaseReady) await deleteDoc(doc(db,'recipes',id));
      else { recipes=recipes.filter(r=>r.id!==id); saveLocal('recipes',recipes); renderRecipes(); }
    }

    // ─────────────────────────────────────────────────
    // TIKTOK ACTIONS
    // ─────────────────────────────────────────────────
    async function addTikTok(url, title, notes, ingredients) {
      const t = { url, title, notes, ingredients, createdAt: firebaseReady ? serverTimestamp() : Date.now() };
      if (firebaseReady) await addDoc(collection(db,'tiktoks'), t);
      else { t.id=Date.now()+''; tiktoks.unshift(t); saveLocal('tiktoks',tiktoks); renderTikTok(); }
    }
    async function deleteTikTok(id) {
      if (firebaseReady) await deleteDoc(doc(db,'tiktoks',id));
      else { tiktoks=tiktoks.filter(t=>t.id!==id); saveLocal('tiktoks',tiktoks); renderTikTok(); }
    }

    // ─────────────────────────────────────────────────
    // MEAL PLAN ACTIONS
    // ─────────────────────────────────────────────────
    async function setMeal(day, slot, value) {
      if (!mealPlan[day]) mealPlan[day]={};
      mealPlan[day][slot]=value;
      if (firebaseReady) await setDoc(doc(db,'config','mealplan'), mealPlan);
      else { saveLocal('mealplan',mealPlan); }
    }

    // ─────────────────────────────────────────────────
    // INGREDIENTS MODAL
    // ─────────────────────────────────────────────────
    function openIngredientsModal(prefill, title) {
      document.getElementById('im-title').textContent = title || 'Zutaten zur Einkaufsliste hinzufügen';
      document.getElementById('im-ingredients').value = prefill || '';
      document.getElementById('ingredients-modal').style.display = 'flex';
      setTimeout(()=>document.getElementById('im-ingredients').focus(), 100);
    }
    window.closeIngredientsModal = function() {
      document.getElementById('ingredients-modal').style.display = 'none';
    }
    window.saveIngredientsModal = async function() {
      const raw = document.getElementById('im-ingredients').value;
      const lines = raw.split('\n').map(l=>l.replace(/^[-•*\d.]+\s*/,'')).filter(l=>l.trim());
      const items = lines.map(name => ({ name, cat: guessCategory(name) }));
      await addShoppingItems(items);
      document.getElementById('ingredients-modal').style.display = 'none';
      // Switch to shopping tab to show result
      switchTab('shopping');
    }

    function getRecipeIngredients(mealText) {
      if (!mealText) return '';
      const r = recipes.find(r => r.name.toLowerCase() === mealText.toLowerCase().trim());
      return r ? r.ingredients : '';
    }

    window.addMealToShopping = function(day, slot) {
      const mealText = mealPlan[day]?.[slot] || '';
      const slotLabels = {breakfast:'Frühstück', lunch:'Mittagessen', dinner:'Abendessen'};
      const title = `Zutaten für ${mealText || slotLabels[slot]} → Einkaufsliste`;
      const prefill = getRecipeIngredients(mealText);
      openIngredientsModal(prefill, title);
    }

    window.addTikTokToShopping = function(id) {
      const t = tiktoks.find(t=>t.id===id);
      if (!t) return;
      openIngredientsModal(t.ingredients || '', `Zutaten: ${t.title}`);
    }

    // ─────────────────────────────────────────────────
    // RENDER: SHOPPING
    // ─────────────────────────────────────────────────
    function renderShopping() {
      const cont = document.getElementById('tab-shopping');
      if (!cont) return;
      const unchecked = shoppingItems.filter(i=>!i.checked);
      const checked = shoppingItems.filter(i=>i.checked);
      const bycat = {};
      for (const item of unchecked) {
        const c = item.cat||'❓ Sonstiges';
        if (!bycat[c]) bycat[c]=[];
        bycat[c].push(item);
      }

      let html = `
        <div class="add-form card">
          <div class="inp-row">
            <input id="si-name" class="inp" placeholder="Artikel tippen…" type="text" autocomplete="off"
              oninput="window.onShoppingInput(this.value)">
            <button class="btn btn-primary add-btn" onclick="window.addShoppingItemUI()">+</button>
          </div>
          <select id="si-cat" class="sel">
            ${CAT_LIST.map(c=>`<option value="${c}">${c}</option>`).join('')}
          </select>
          <div id="si-hint" class="cat-hint"></div>
        </div>`;

      if (shoppingItems.length===0) {
        html += `<div class="empty-state">🛒<br>Liste ist leer!<br><span>Füge deinen ersten Artikel hinzu</span></div>`;
      } else {
        for (const [cat, items] of Object.entries(bycat)) {
          html += `<div class="category-section"><div class="category-header">${cat}</div>`;
          for (const item of items) {
            html += `<div class="list-item" onclick="window.toggleShopping('${item.id}')">
              <div class="check-circle"></div>
              <span class="item-name">${esc(item.name)}</span>
              <button class="del-btn" onclick="event.stopPropagation();window.deleteShopping('${item.id}')">✕</button>
            </div>`;
          }
          html += `</div>`;
        }
        if (checked.length>0) {
          html += `<div class="category-section"><div class="category-header checked-header">✓ Erledigt (${checked.length})</div>`;
          for (const item of checked) {
            html += `<div class="list-item checked" onclick="window.toggleShopping('${item.id}')">
              <div class="check-circle checked">✓</div>
              <span class="item-name">${esc(item.name)}</span>
              <button class="del-btn" onclick="event.stopPropagation();window.deleteShopping('${item.id}')">✕</button>
            </div>`;
          }
          html += `<button class="btn btn-ghost full mt" onclick="window.clearChecked()">🗑️ Erledigte löschen</button></div>`;
        }
      }
      cont.innerHTML = html;
    }

    window.onShoppingInput = function(val) {
      if (!val.trim()) {
        document.getElementById('si-hint').textContent='';
        return;
      }
      const cat = guessCategory(val);
      const sel = document.getElementById('si-cat');
      if (sel) sel.value = cat;
      const hint = document.getElementById('si-hint');
      if (hint) {
        hint.textContent = cat !== '❓ Sonstiges' ? `↳ Erkannt als: ${cat}` : '';
      }
    }

    // ─────────────────────────────────────────────────
    // RENDER: RECIPES
    // ─────────────────────────────────────────────────
    function renderRecipes() {
      const cont = document.getElementById('tab-recipes');
      if (!cont) return;
      let html = `<button class="btn btn-primary full mb" onclick="window.openRecipeModal()">+ Neues Rezept</button>`;
      if (recipes.length===0) {
        html += `<div class="empty-state">🍽️<br>Noch keine Rezepte!<br><span>Füge dein erstes Rezept hinzu</span></div>`;
      } else {
        for (const r of recipes) {
          html += `<div class="card recipe-card">
            <div class="recipe-header">
              <span class="recipe-name">${esc(r.name)}</span>
              <div class="recipe-actions">
                <button class="btn btn-sm btn-outline" onclick="window.addRecipeToShopping('${r.id}')">🛒</button>
                <button class="del-btn" onclick="window.deleteRecipeUI('${r.id}')">✕</button>
              </div>
            </div>
            <details>
              <summary>Zutaten & Zubereitung anzeigen</summary>
              <div class="recipe-body">
                <strong>Zutaten:</strong><br>${esc(r.ingredients||'').replace(/\n/g,'<br>')}
                <hr>
                <strong>Zubereitung:</strong><br>${esc(r.instructions||'').replace(/\n/g,'<br>')}
              </div>
            </details>
          </div>`;
        }
      }
      cont.innerHTML = html;
    }

    window.addRecipeToShopping = function(id) {
      const r = recipes.find(r=>r.id===id);
      if (!r) return;
      openIngredientsModal(r.ingredients||'', `Zutaten: ${r.name}`);
    }

    // ─────────────────────────────────────────────────
    // RENDER: TIKTOK
    // ─────────────────────────────────────────────────
    function renderTikTok() {
      const cont = document.getElementById('tab-tiktok');
      if (!cont) return;
      let html = `
        <div class="add-form card">
          <input id="tt-url" class="inp" placeholder="TikTok-Link einfügen…" type="url">
          <input id="tt-title" class="inp" placeholder="Rezeptname / Beschreibung *" type="text">
          <textarea id="tt-ingredients" class="inp" placeholder="Zutaten (eine pro Zeile, optional)&#10;z.B. 200g Hähnchenbrust&#10;1 Zwiebel&#10;2 Knoblauchzehen" rows="4"></textarea>
          <input id="tt-notes" class="inp" placeholder="Notizen (optional)" type="text">
          <button class="btn btn-primary full" onclick="window.addTikTokUI()">💾 Speichern</button>
        </div>`;
      if (tiktoks.length===0) {
        html += `<div class="empty-state">🎵<br>Noch keine TikTok-Rezepte!<br><span>Füge deinen ersten Link hinzu</span></div>`;
      } else {
        for (const t of tiktoks) {
          const hasIngredients = t.ingredients && t.ingredients.trim();
          html += `<div class="card tiktok-card">
            <div class="tiktok-thumb" onclick="window.open('${esc(t.url)}','_blank')">
              <div class="play-btn">▶</div>
              <div class="tiktok-logo">🎵 TikTok</div>
            </div>
            <div class="tiktok-info">
              <div class="tiktok-title">${esc(t.title||'Rezept')}</div>
              ${t.notes ? `<div class="tiktok-notes">${esc(t.notes)}</div>` : ''}
              ${hasIngredients ? `<div class="ingredient-preview">${esc(t.ingredients).split('\n').slice(0,3).join(' · ')}${t.ingredients.split('\n').length>3?'…':''}</div>` : ''}
              <div class="tiktok-actions">
                <button class="btn btn-sm btn-outline" onclick="window.open('${esc(t.url)}','_blank')">▶ Öffnen</button>
                <button class="btn btn-sm btn-green" onclick="window.addTikTokToShopping('${t.id}')">🛒 Einkauf</button>
                <button class="btn btn-sm btn-ghost" onclick="window.deleteTikTokUI('${t.id}')">✕</button>
              </div>
            </div>
          </div>`;
        }
      }
      cont.innerHTML = html;
    }

    // ─────────────────────────────────────────────────
    // RENDER: MEALS
    // ─────────────────────────────────────────────────
    function renderMeals() {
      const cont = document.getElementById('tab-meals');
      if (!cont) return;
      const weekDates = getWeekDates();
      const slots = [
        ['🌅 Frühstück','breakfast'],
        ['☀️ Mittagessen','lunch'],
        ['🌙 Abendessen','dinner']
      ];
      let html = `<div class="meals-grid">`;
      DAYS.forEach((day, i) => {
        const d = weekDates[i];
        const today = isToday(d);
        html += `<div class="day-card card${today?' today-card':''}">
          <div class="day-header">
            <div class="day-name-wrap">
              <span class="day-abbr${today?' today-badge':''}">${day}</span>
              <span class="day-date">${fmtDate(d)}</span>
              ${today?`<span class="today-label">Heute</span>`:''}
            </div>
          </div>`;
        for (const [label, slot] of slots) {
          const val = mealPlan[day]?.[slot] || '';
          const hasRecipe = recipes.some(r=>r.name.toLowerCase()===val.toLowerCase().trim());
          html += `<div class="meal-slot">
            <div class="meal-label-row">
              <span class="meal-label">${label}</span>
              <button class="meal-cart-btn" title="Zutaten zur Einkaufsliste" onclick="window.addMealToShopping('${day}','${slot}')">🛒</button>
            </div>
            <input class="inp meal-inp${hasRecipe?' has-recipe':''}" value="${esc(val)}" placeholder="Was essen?"
              onblur="window.updateMeal('${day}','${slot}',this.value)"
              oninput="window.onMealInput(this,'${day}','${slot}')"
              onkeydown="if(event.key==='Enter')this.blur()">
            ${hasRecipe?`<div class="recipe-link-hint">📖 Rezept vorhanden</div>`:''}
          </div>`;
        }
        html += `</div>`;
      });
      html += `</div>`;
      cont.innerHTML = html;
    }

    window.onMealInput = function(el, day, slot) {
      const val = el.value;
      const hasRecipe = recipes.some(r=>r.name.toLowerCase()===val.toLowerCase().trim());
      el.classList.toggle('has-recipe', hasRecipe);
      const hint = el.nextElementSibling;
      if (hint && hint.classList.contains('recipe-link-hint')) {
        hint.style.display = hasRecipe ? 'block' : 'none';
      }
    }

    // ─────────────────────────────────────────────────
    // MODAL: RECIPE
    // ─────────────────────────────────────────────────
    window.openRecipeModal = function() {
      document.getElementById('recipe-modal').style.display='flex';
    }
    window.closeRecipeModal = function() {
      document.getElementById('recipe-modal').style.display='none';
    }
    window.saveRecipeModal = async function() {
      const name = document.getElementById('rm-name').value.trim();
      const ing = document.getElementById('rm-ing').value.trim();
      const ins = document.getElementById('rm-ins').value.trim();
      if (!name) { alert('Bitte einen Namen eingeben!'); return; }
      await addRecipe(name, ing, ins);
      document.getElementById('recipe-modal').style.display='none';
      ['rm-name','rm-ing','rm-ins'].forEach(id=>document.getElementById(id).value='');
    }

    // ─────────────────────────────────────────────────
    // GLOBAL HANDLERS
    // ─────────────────────────────────────────────────
    window.addShoppingItemUI = async function() {
      const name = document.getElementById('si-name').value.trim();
      const cat = document.getElementById('si-cat').value;
      if (!name) return;
      document.getElementById('si-name').value='';
      document.getElementById('si-hint').textContent='';
      await addShoppingItem(name, cat);
    }
    window.toggleShopping = async function(id) { await toggleShoppingItem(id); }
    window.deleteShopping = async function(id) { await deleteShoppingItem(id); }
    window.clearChecked = async function() { await clearCheckedItems(); }
    window.deleteRecipeUI = async function(id) {
      if (confirm('Rezept löschen?')) await deleteRecipe(id);
    }
    window.addTikTokUI = async function() {
      const url = document.getElementById('tt-url').value.trim();
      const title = document.getElementById('tt-title').value.trim();
      const ingredients = document.getElementById('tt-ingredients').value.trim();
      const notes = document.getElementById('tt-notes').value.trim();
      if (!url) { alert('Bitte einen TikTok-Link einfügen!'); return; }
      ['tt-url','tt-title','tt-ingredients','tt-notes'].forEach(id=>document.getElementById(id).value='');
      await addTikTok(url, title||'TikTok Rezept', notes, ingredients);
    }
    window.deleteTikTokUI = async function(id) {
      if (confirm('TikTok-Rezept löschen?')) await deleteTikTok(id);
    }
    window.updateMeal = async function(day, slot, value) { await setMeal(day, slot, value); }

    // ─────────────────────────────────────────────────
    // TABS
    // ─────────────────────────────────────────────────
    window.switchTab = function(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-pane').forEach(p=>p.style.display='none');
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('tab-'+tab).style.display='block';
      document.getElementById('btn-'+tab).classList.add('active');
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (currentTab==='shopping') renderShopping();
      else if (currentTab==='meals') renderMeals();
      else if (currentTab==='recipes') renderRecipes();
      else if (currentTab==='tiktok') renderTikTok();
    }

    // ─────────────────────────────────────────────────
    // UTILS
    // ─────────────────────────────────────────────────
    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    window.esc = esc;

    // Enter key in shopping input
    document.addEventListener('keydown', e => {
      if (e.key==='Enter' && document.activeElement===document.getElementById('si-name')) {
        window.addShoppingItemUI();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      startListeners();
      switchTab('shopping');
    });
  </script>

  <style>
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    :root {
      --primary:#ff6b6b; --primary-dark:#ee5a5a;
      --green:#06d6a0; --green-dark:#05b98a;
      --yellow:#ffd166;
      --bg:#f8f5f0; --card:#ffffff;
      --text:#2d2d2d; --text2:#888;
      --border:#ede8e0; --radius:16px; --nav-h:72px;
    }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; max-width:430px; margin:0 auto;
    }

    /* HEADER */
    .app-header {
      background:linear-gradient(135deg,var(--primary),#ff8e53);
      color:white; padding:52px 20px 20px;
      position:sticky; top:0; z-index:10;
    }
    .app-title { font-size:22px; font-weight:700; }
    .app-subtitle { font-size:13px; opacity:.85; margin-top:2px; }

    /* OFFLINE */
    #offline-banner {
      display:none; background:#fff3cd; color:#856404;
      padding:10px 16px; font-size:13px;
      align-items:center; gap:8px;
      border-bottom:1px solid #ffc107;
    }

    /* CONTENT */
    .content { padding:16px 16px calc(var(--nav-h) + 16px); }

    /* CARD */
    .card {
      background:var(--card); border-radius:var(--radius);
      padding:16px; margin-bottom:12px;
      box-shadow:0 2px 12px rgba(0,0,0,.06);
    }

    /* INPUTS */
    .inp {
      width:100%; border:1.5px solid var(--border); border-radius:10px;
      padding:11px 14px; font-size:15px; margin-bottom:10px;
      background:#faf8f5; color:var(--text); outline:none;
      transition:border-color .2s; font-family:inherit;
    }
    .inp:focus { border-color:var(--primary); }
    textarea.inp { min-height:90px; resize:vertical; line-height:1.5; }
    .sel {
      width:100%; border:1.5px solid var(--border); border-radius:10px;
      padding:11px 14px; font-size:14px; margin-bottom:8px;
      background:#faf8f5; color:var(--text); outline:none;
      -webkit-appearance:none; appearance:none;
    }
    .inp-row { display:flex; gap:8px; align-items:stretch; margin-bottom:0; }
    .inp-row .inp { margin-bottom:0; flex:1; }
    .add-form { margin-bottom:16px; }
    .add-form .inp-row { margin-bottom:10px; }

    /* CAT HINT */
    .cat-hint { font-size:12px; color:var(--green); margin-top:-6px; margin-bottom:8px; min-height:16px; padding-left:2px; }

    /* BUTTONS */
    .btn {
      display:inline-flex; align-items:center; justify-content:center;
      border:none; border-radius:10px; padding:11px 18px;
      font-size:15px; font-weight:600; cursor:pointer;
      transition:transform .1s, opacity .2s; font-family:inherit;
    }
    .btn:active { transform:scale(.97); opacity:.85; }
    .btn-primary { background:var(--primary); color:white; }
    .btn-primary:hover { background:var(--primary-dark); }
    .btn-green { background:var(--green); color:white; }
    .btn-green:hover { background:var(--green-dark); }
    .btn-ghost { background:transparent; color:var(--text2); font-size:13px; }
    .btn-outline { background:transparent; border:1.5px solid var(--primary); color:var(--primary); font-size:13px; padding:7px 14px; }
    .btn-sm { padding:7px 14px; font-size:13px; border-radius:8px; }
    .full { width:100%; }
    .mb { margin-bottom:12px; }
    .mt { margin-top:8px; }
    .add-btn { flex-shrink:0; padding:11px 20px; border-radius:10px; font-size:20px; line-height:1; }

    /* SHOPPING LIST */
    .category-section { margin-bottom:4px; }
    .category-header {
      font-size:11px; font-weight:700; text-transform:uppercase;
      color:var(--text2); padding:8px 4px 4px; letter-spacing:.5px;
    }
    .checked-header { color:var(--green); }
    .list-item {
      display:flex; align-items:center; gap:12px;
      background:var(--card); border-radius:12px;
      padding:13px 14px; margin-bottom:6px;
      box-shadow:0 1px 6px rgba(0,0,0,.05);
      cursor:pointer; transition:transform .1s;
    }
    .list-item:active { transform:scale(.98); }
    .list-item.checked { opacity:.55; }
    .check-circle {
      width:24px; height:24px; border-radius:50%;
      border:2px solid var(--border); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color:white; transition:all .2s;
    }
    .check-circle.checked { background:var(--green); border-color:var(--green); }
    .item-name { flex:1; font-size:16px; }
    .list-item.checked .item-name { text-decoration:line-through; color:var(--text2); }
    .del-btn {
      background:none; border:none; color:var(--text2);
      font-size:16px; cursor:pointer; padding:4px 8px;
      border-radius:6px; flex-shrink:0;
    }
    .del-btn:active { background:#ffe0e0; color:var(--primary); }

    /* RECIPES */
    .recipe-card { padding:14px; }
    .recipe-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .recipe-name { font-size:16px; font-weight:700; flex:1; }
    .recipe-actions { display:flex; align-items:center; gap:6px; }
    details summary { font-size:13px; color:var(--primary); cursor:pointer; padding:4px 0; }
    .recipe-body { font-size:14px; line-height:1.7; margin-top:10px; color:var(--text); }
    .recipe-body hr { border:none; border-top:1px solid var(--border); margin:10px 0; }

    /* TIKTOK */
    .tiktok-card { display:flex; gap:12px; padding:12px; }
    .tiktok-thumb {
      width:70px; height:88px;
      background:linear-gradient(135deg,#010101,#2d2d2d);
      border-radius:10px; flex-shrink:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      cursor:pointer; position:relative; overflow:hidden;
    }
    .tiktok-thumb::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,#69c9d0 0%,#010101 50%,#ee1d52 100%);
      opacity:.7;
    }
    .play-btn { font-size:20px; color:white; position:relative; z-index:1; }
    .tiktok-logo { font-size:9px; color:white; position:relative; z-index:1; margin-top:4px; opacity:.9; }
    .tiktok-info { flex:1; min-width:0; }
    .tiktok-title { font-size:15px; font-weight:600; margin-bottom:3px; }
    .tiktok-notes { font-size:12px; color:var(--text2); margin-bottom:5px; }
    .ingredient-preview { font-size:11px; color:var(--green); margin-bottom:6px; }
    .tiktok-actions { display:flex; gap:6px; flex-wrap:wrap; }

    /* MEALS */
    .meals-grid { display:flex; flex-direction:column; gap:10px; }
    .day-card { padding:14px; }
    .today-card { border:2px solid var(--primary); }
    .day-header { margin-bottom:12px; }
    .day-name-wrap { display:flex; align-items:center; gap:8px; }
    .day-abbr { font-size:17px; font-weight:700; }
    .day-abbr.today-badge { color:var(--primary); }
    .day-date { font-size:13px; color:var(--text2); }
    .today-label {
      background:var(--primary); color:white;
      font-size:10px; font-weight:700; padding:2px 7px;
      border-radius:20px; text-transform:uppercase; letter-spacing:.3px;
    }
    .meal-slot { margin-bottom:10px; }
    .meal-label-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .meal-label { font-size:12px; color:var(--text2); }
    .meal-cart-btn {
      background:none; border:none; font-size:14px; cursor:pointer;
      padding:2px 5px; border-radius:6px; color:var(--text2);
      transition:background .15s;
    }
    .meal-cart-btn:active { background:#e8f8f3; }
    .meal-inp { margin-bottom:3px; font-size:14px; padding:9px 12px; }
    .meal-inp.has-recipe { border-color:var(--green); }
    .recipe-link-hint { font-size:11px; color:var(--green); margin-bottom:4px; }

    /* EMPTY */
    .empty-state {
      text-align:center; padding:48px 20px;
      color:var(--text2); font-size:20px; line-height:1.6;
    }
    .empty-state span { font-size:14px; display:block; margin-top:4px; }

    /* BOTTOM NAV */
    .bottom-nav {
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:430px;
      background:rgba(255,255,255,.95);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-top:1px solid var(--border);
      display:flex; height:var(--nav-h);
      padding-bottom:env(safe-area-inset-bottom);
      z-index:100;
    }
    .tab-btn {
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:3px; background:none; border:none;
      cursor:pointer; color:var(--text2); font-size:11px; font-weight:500;
    }
    .tab-btn .icon { font-size:22px; transition:transform .2s; }
    .tab-btn.active { color:var(--primary); }
    .tab-btn.active .icon { transform:scale(1.1); }

    /* MODALS */
    .modal-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,.45); z-index:200;
      align-items:flex-end; justify-content:center;
    }
    .modal {
      background:var(--card); border-radius:24px 24px 0 0;
      padding:24px 20px 40px; width:100%; max-width:430px;
      max-height:85vh; overflow-y:auto;
    }
    .modal-handle { width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 20px; }
    .modal-title { font-size:18px; font-weight:700; margin-bottom:4px; }
    .modal-subtitle { font-size:13px; color:var(--text2); margin-bottom:16px; }
    .modal-btns { display:flex; gap:10px; margin-top:4px; }
  </style>
</head>
<body>

  <div id="offline-banner">⚠️ Firebase nicht eingerichtet – Daten nur lokal (kein Sync)</div>

  <div class="app-header">
    <div class="app-title">🍽️ Unser Foodplaner</div>
    <div class="app-subtitle">Einkaufen · Planen · Kochen</div>
  </div>

  <div class="content">
    <div id="tab-shopping" class="tab-pane"></div>
    <div id="tab-meals"    class="tab-pane" style="display:none"></div>
    <div id="tab-recipes"  class="tab-pane" style="display:none"></div>
    <div id="tab-tiktok"   class="tab-pane" style="display:none"></div>
  </div>

  <nav class="bottom-nav">
    <button class="tab-btn active" id="btn-shopping" onclick="switchTab('shopping')">
      <span class="icon">🛒</span>Einkaufen
    </button>
    <button class="tab-btn" id="btn-meals" onclick="switchTab('meals')">
      <span class="icon">📅</span>Wochenplan
    </button>
    <button class="tab-btn" id="btn-recipes" onclick="switchTab('recipes')">
      <span class="icon">📖</span>Rezepte
    </button>
    <button class="tab-btn" id="btn-tiktok" onclick="switchTab('tiktok')">
      <span class="icon">🎵</span>TikTok
    </button>
  </nav>

  <!-- MODAL: Rezept hinzufügen -->
  <div class="modal-overlay" id="recipe-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Neues Rezept</div>
      <div class="modal-subtitle">Tipp: Wenn du im Wochenplan denselben Namen einträgst, erkennt die App das Rezept automatisch.</div>
      <input id="rm-name" class="inp" placeholder="Rezeptname *" type="text">
      <textarea id="rm-ing" class="inp" placeholder="Zutaten (eine pro Zeile)&#10;z.B. 500g Hähnchenbrust&#10;2 Knoblauchzehen"></textarea>
      <textarea id="rm-ins" class="inp" placeholder="Zubereitung / Anleitung"></textarea>
      <div class="modal-btns">
        <button class="btn btn-primary" style="flex:1" onclick="saveRecipeModal()">💾 Speichern</button>
        <button class="btn btn-ghost" onclick="closeRecipeModal()">Abbrechen</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Zutaten zur Einkaufsliste -->
  <div class="modal-overlay" id="ingredients-modal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="im-title">Zutaten zur Einkaufsliste</div>
      <div class="modal-subtitle">Zutaten prüfen, anpassen und alle auf einmal hinzufügen.</div>
      <textarea id="im-ingredients" class="inp" style="min-height:160px"
        placeholder="Zutaten eingeben (eine pro Zeile)&#10;z.B. 500g Hähnchenbrust&#10;2 Knoblauchzehen&#10;1 Paprika"></textarea>
      <div class="modal-btns">
        <button class="btn btn-green" style="flex:1" onclick="saveIngredientsModal()">🛒 Alle hinzufügen</button>
        <button class="btn btn-ghost" onclick="closeIngredientsModal()">Abbrechen</button>
      </div>
    </div>
  </div>

</body>
</html>
